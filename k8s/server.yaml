apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixit-server
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-server
    app.kubernetes.io/part-of: fixit-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fixit-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixit-server
    spec:
      containers:
        - name: server
          image: fixit-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: fixit-config
            - secretRef:
                name: fixit-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fixit-server
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-server
    app.kubernetes.io/part-of: fixit-platform
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app.kubernetes.io/name: fixit-server
