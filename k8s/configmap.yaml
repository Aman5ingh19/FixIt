apiVersion: v1
kind: ConfigMap
metadata:
  name: fixit-config
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-config
    app.kubernetes.io/part-of: fixit-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_URL: "http://fixit.local"
  CORS_ORIGINS: "http://fixit.local,http://localhost"
  POSTGRES_DB: "fixit_db"
  POSTGRES_USER: "fixit_user"
  REDIS_URL: "redis://fixit-redis:6379"
  RABBITMQ_URL: "amqp://guest:guest@fixit-rabbitmq:5672"
  KAFKA_BROKERS: "fixit-kafka:9092"
  KAFKA_CLIENT_ID: "fixit-api"
  KAFKA_SSL: "false"
  N8N_WEBHOOK_URL: "http://fixit-n8n:5678/webhook"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
