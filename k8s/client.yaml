apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixit-client
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-client
    app.kubernetes.io/part-of: fixit-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fixit-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixit-client
    spec:
      containers:
        - name: client
          image: fixit-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fixit-client
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-client
    app.kubernetes.io/part-of: fixit-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: fixit-client
