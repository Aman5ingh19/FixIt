apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fixit-postgres-pvc
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-postgres
    app.kubernetes.io/part-of: fixit-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixit-postgres
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-postgres
    app.kubernetes.io/part-of: fixit-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fixit-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixit-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: fixit-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: fixit-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixit-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fixit_user", "-d", "fixit_db"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fixit_user", "-d", "fixit_db"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: fixit-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fixit-postgres
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-postgres
    app.kubernetes.io/part-of: fixit-platform
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: fixit-postgres
