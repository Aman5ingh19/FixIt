apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixit-redis
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-redis
    app.kubernetes.io/part-of: fixit-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fixit-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixit-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fixit-redis
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-redis
    app.kubernetes.io/part-of: fixit-platform
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: fixit-redis
