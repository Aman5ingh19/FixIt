apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fixit-ingress
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-ingress
    app.kubernetes.io/part-of: fixit-platform
  annotations:
    # Generic Ingress annotations compatible with NGINX, Traefik, or any standard Ingress controller
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "fixit-server"
spec:
  ingressClassName: nginx
  rules:
    - host: fixit.local
      http:
        paths:
          # API traffic routed to backend server
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fixit-server
                port:
                  number: 5000
          # WebSocket / Socket.IO traffic routed to backend server
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: fixit-server
                port:
                  number: 5000
          # Frontend web app traffic
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fixit-client
                port:
                  number: 80
