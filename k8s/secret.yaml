apiVersion: v1
kind: Secret
metadata:
  name: fixit-secrets
  namespace: fixit
  labels:
    app.kubernetes.io/name: fixit-secrets
    app.kubernetes.io/part-of: fixit-platform
type: Opaque
stringData:
  # Database credentials
  POSTGRES_PASSWORD: "fixit_password_change_me"
  DATABASE_URL: "postgresql://fixit_user:fixit_password_change_me@fixit-postgres:5432/fixit_db?schema=public"

  # JWT Secrets
  JWT_ACCESS_SECRET: "fixit-jwt-access-secret-production-change-me"
  JWT_REFRESH_SECRET: "fixit-jwt-refresh-secret-production-change-me"

  # Cloudinary Credentials (Optional)
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""

  # Kafka SASL Credentials (Optional - for Upstash/Confluent)
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
  KAFKA_SASL_MECHANISM: "scram-sha-256"

  # n8n API Key (Optional - for n8n Cloud)
  N8N_API_KEY: ""
