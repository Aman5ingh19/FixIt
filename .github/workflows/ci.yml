name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── Lint & Build Server ──
  server:
    name: Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixit_user
          POSTGRES_PASSWORD: fixit_password
          POSTGRES_DB: fixit_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://fixit_user:fixit_password@localhost:5432/fixit_db_test

      - name: Run linting
        run: npx eslint src/ --ext .js --max-warnings 0
        continue-on-error: true

      - name: Run tests
        run: npm test --if-present
        env:
          DATABASE_URL: postgresql://fixit_user:fixit_password@localhost:5432/fixit_db_test
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          NODE_ENV: test

  # ── Lint & Build Client ──
  client:
    name: Client CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npx eslint src/ --ext .js,.jsx --max-warnings 0
        continue-on-error: true

      - name: Build
        run: npm run build

  # ── Docker Build (only on main) ──
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [server, client]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Server Image
        run: docker build -t fixit-server:${{ github.sha }} ./server

      - name: Build Client Image
        run: docker build -t fixit-client:${{ github.sha }} ./client
