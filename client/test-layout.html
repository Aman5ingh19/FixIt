<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }
        body {
            background: #f8fafc;
        }
        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
            background: rgba(255,0,0,0.1);
        }
        .content {
            background: white;
            padding: 2rem;
            margin: 1rem 0;
        }
        .debug {
            position: fixed;
            top: 0;
            right: 0;
            background: black;
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="debug">
        Viewport: <span id="vw"></span>px | 
        Body: <span id="bw"></span>px | 
        Scroll: <span id="scroll"></span>px
    </div>
    <div class="container">
        <div class="content">
            <h1>Layout Test</h1>
            <p>If you see horizontal scrollbar or red bleeding outside viewport, there's an overflow issue.</p>
            <p>Container should be centered with equal margins on both sides.</p>
        </div>
    </div>
    <script>
        function updateDebug() {
            document.getElementById('vw').textContent = window.innerWidth;
            document.getElementById('bw').textContent = document.body.scrollWidth;
            document.getElementById('scroll').textContent = document.body.scrollWidth - window.innerWidth;
        }
        updateDebug();
        window.addEventListener('resize', updateDebug);
    </script>
</body>
</html>
